# PR/push CI: lint, typecheck and portable build/tests.
# To run full CI: use workflow_dispatch with 'level' input
# Local equivalents:
#   minimal: npm run ci:minimal
#   standard: npm run ci
#   full: npm run ci:full
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      level:
        description: "CI level to run"
        required: false
        type: choice
        options:
          - minimal
          - standard
          - full
        default: "minimal"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  MCP_PUBLISHER_VERSION: "1.7.9"
  MCP_PUBLISHER_SHA256: "ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac"

jobs:
  # Stage 0: Verify Commit Signatures (MANDATORY - always runs)
  verify-signatures:
    name: Verify Signatures
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Import GPG keys
        run: |
          echo "${{ secrets.TRUSTED_GPG_KEYS }}" | base64 -d | gpg --import

      - name: Verify commit signatures
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            COMMIT_RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            COMMIT_RANGE="${{ github.sha }}^..${{ github.sha }}"
          else
            COMMIT_RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          echo "Verifying commits in range: $COMMIT_RANGE"
          UNSIGNED_COMMITS=""
          for commit in $(git log --format="%H" $COMMIT_RANGE); do
            if ! git verify-commit $commit 2>/dev/null; then
              UNSIGNED_COMMITS="$UNSIGNED_COMMITS $commit"
            fi
          done
          if [ -n "$UNSIGNED_COMMITS" ]; then
            echo "❌ Unsigned commits found:"
            for commit in $UNSIGNED_COMMITS; do
              git log --format="%H %an <%ae> %s" -n 1 $commit
            done
            exit 1
          fi
          echo "✅ All commits signed"

  # Minimal gates: lint + typecheck (always runs)
  lint:
    name: Lint
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: verify-signatures
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci --ignore-scripts
      - run: npm run lint

  typecheck:
    name: TypeCheck
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: verify-signatures
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run type-check

  mcp-registry-contract:
    name: MCP Registry Contract
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: verify-signatures
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci --ignore-scripts
      - run: npm run check:mcp-registry-contract
      - name: Validate manifest with pinned MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHER_ROOT=$(mktemp -d)
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" -o "$PUBLISHER_ROOT/mcp-publisher.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  $PUBLISHER_ROOT/mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf "$PUBLISHER_ROOT/mcp-publisher.tar.gz" -C "$PUBLISHER_ROOT"
          "$PUBLISHER_ROOT/mcp-publisher" validate server.json
      - run: npm run check:node-runtime
      - run: npm run check:dependency-audit
      - run: npm run check:ecosystem-release

  # Build/tests qualify PRs and main; manual minimal runs may omit them.
  build-and-test:
    name: Build & Test
    timeout-minutes: 50
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    needs: [lint, typecheck]
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (inputs.level == 'standard' || inputs.level == 'full')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci --ignore-scripts
      - run: npm rebuild better-sqlite3-multiple-ciphers
      - run: bash scripts/setup-local.sh
      - run: npm run build
      - run: npm run validate-schemas
      - run: npm run coverage

  # Full gates: integration tests (only on workflow_dispatch with level == full)
  integration-tests:
    name: Integration Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: build-and-test
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.level == 'full'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci --ignore-scripts
      - run: npm rebuild better-sqlite3-multiple-ciphers
      - run: npm run setup-local
      - run: npm run build
      - run: npm run test:integration

  # Package validation (only on full)
  validate-packages:
    name: Validate Packages
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: build-and-test
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.level == 'full'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci --ignore-scripts
      - run: npm run setup-local
      - run: npm run build
      - run: npm run guard:pack

  # Summary job
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs:
      [
        verify-signatures,
        lint,
        typecheck,
        mcp-registry-contract,
        build-and-test,
        integration-tests,
        validate-packages,
      ]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.verify-signatures.result }}" != "success" ]]; then
            echo "❌ Signature verification failed"; exit 1
          fi
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "❌ Lint failed"; exit 1
          fi
          if [[ "${{ needs.typecheck.result }}" != "success" ]]; then
            echo "❌ TypeCheck failed"; exit 1
          fi
          if [[ "${{ needs.mcp-registry-contract.result }}" != "success" ]]; then
            echo "❌ MCP Registry Contract failed"; exit 1
          fi
          if [[ "${{ needs.build-and-test.result }}" != "success" && !( "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.level }}" == "minimal" && "${{ needs.build-and-test.result }}" == "skipped" ) ]]; then
            echo "❌ Build and tests did not pass"; exit 1
          fi
          if [[ "${{ inputs.level }}" == "full" && ( "${{ needs.integration-tests.result }}" != "success" || "${{ needs.validate-packages.result }}" != "success" ) ]]; then
            echo "❌ Full qualification did not pass"; exit 1
          fi
          echo "✅ CI Complete (level: ${{ inputs.level || 'standard' }})"
