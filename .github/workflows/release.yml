name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Candidate version from package.json (for example, 4.0.4)"
        required: true
        type: string
      publish:
        description: "Publish the verified candidate to npm after protected-environment approval"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  GH_VERIFY_VERSION: "2.89.0"
  GH_VERIFY_SHA256: "d0422caade520530e76c1c558da47daebaa8e1203d6b7ff10ad7d6faba3490d8"
  MCP_PUBLISHER_VERSION: "1.7.9"
  MCP_PUBLISHER_SHA256: "ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac"

jobs:
  validate-identity:
    name: Validate release identity
    runs-on: ubuntu-latest
    outputs:
      commit_signer: ${{ steps.identity.outputs.commit_signer }}
      main_snapshot: ${{ steps.identity.outputs.main_snapshot }}
      source_commit: ${{ steps.identity.outputs.source_commit }}
      tag_object: ${{ steps.identity.outputs.tag_object }}
      tag_signer: ${{ steps.identity.outputs.tag_signer }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate package, ref, and main identity
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          TRUSTED_GPG_KEYS: ${{ secrets.TRUSTED_GPG_KEYS }}
          TRUSTED_COMMIT_FINGERPRINTS: ${{ vars.TRUSTED_COMMIT_FINGERPRINTS }}
          TRUSTED_RELEASE_FINGERPRINTS: ${{ vars.TRUSTED_RELEASE_FINGERPRINTS }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          git fetch --no-tags origin main
          MAIN_SNAPSHOT=$(git rev-parse origin/main)
          printf 'main_snapshot=%s\nsource_commit=%s\n' "$MAIN_SNAPSHOT" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$GITHUB_SHA" != "$MAIN_SNAPSHOT" ]; then
              echo "Candidate dispatch must target the current origin/main tip"
              exit 1
            fi
            if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$REQUESTED_VERSION" != "$PACKAGE_VERSION" ]; then
              echo "Requested version does not exactly match package $PACKAGE_VERSION"
              exit 1
            fi
            exit 0
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Tag $RELEASE_TAG does not exactly match package v$PACKAGE_VERSION"
            exit 1
          fi
          if [ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]; then
            echo "Release tag must be annotated"
            exit 1
          fi
          TAG_OBJECT=$(git rev-parse "refs/tags/$RELEASE_TAG")
          TARGET=$(git rev-list -n 1 "$RELEASE_TAG")
          if [ "$TARGET" != "$GITHUB_SHA" ] || [ "$TARGET" != "$MAIN_SNAPSHOT" ]; then
            echo "Release tag must target the exact current origin/main tip"
            exit 1
          fi
          printf 'tag_object=%s\n' "$TAG_OBJECT" >> "$GITHUB_OUTPUT"
          node scripts/verify-release-tag.mjs "$RELEASE_TAG" "$TARGET"
          if [ -z "$TRUSTED_GPG_KEYS" ] || [ -z "$TRUSTED_RELEASE_FINGERPRINTS" ] || [ -z "$TRUSTED_COMMIT_FINGERPRINTS" ]; then
            echo "TRUSTED_GPG_KEYS, TRUSTED_RELEASE_FINGERPRINTS, and TRUSTED_COMMIT_FINGERPRINTS are required"
            exit 1
          fi
          echo "$TRUSTED_GPG_KEYS" | base64 -d | gpg --import
          node scripts/verify-release-signatures.mjs \
            "$RELEASE_TAG" \
            "$TARGET" \
            "$TRUSTED_RELEASE_FINGERPRINTS" \
            "$TRUSTED_COMMIT_FINGERPRINTS"

  build-candidate:
    name: Build, verify, and retain candidate
    timeout-minutes: 60
    needs: validate-identity
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.1"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Pin npm used for candidate bytes
        run: npm install --global npm@11.11.0

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build native dependencies
        run: npm rebuild better-sqlite3-multiple-ciphers

      - name: Run the full gate
        run: |
          npm run check-sqlite
          npm run validate-schemas
          npm run validate-docs
          npm run check:node-runtime
          npm run check:ecosystem-release
          npm run check:mcp-registry-contract
          npm run ci:full

      - name: Validate manifest with pinned MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHER_ROOT=$(mktemp -d)
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" -o "$PUBLISHER_ROOT/mcp-publisher.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  $PUBLISHER_ROOT/mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf "$PUBLISHER_ROOT/mcp-publisher.tar.gz" -C "$PUBLISHER_ROOT"
          "$PUBLISHER_ROOT/mcp-publisher" validate server.json

      - name: Create and verify commit-bound release candidate
        env:
          LEX_RELEASE_COMMIT_SIGNER: ${{ needs.validate-identity.outputs.commit_signer }}
          LEX_RELEASE_EVENT: ${{ github.event_name }}
          LEX_RELEASE_MAIN_SNAPSHOT: ${{ needs.validate-identity.outputs.main_snapshot }}
          LEX_RELEASE_TAG: ${{ github.ref_name }}
          LEX_RELEASE_TAG_OBJECT: ${{ needs.validate-identity.outputs.tag_object }}
          LEX_RELEASE_TAG_SIGNER: ${{ needs.validate-identity.outputs.tag_signer }}
        run: npm run release:candidate

      - name: Attest retained candidate and receipt
        id: attest-candidate
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            smartergpt-lex-*.tgz
            release-candidate.json

      - name: Stage attestation bundle with candidate
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest-candidate.outputs.bundle-path }}
        run: cp "$ATTESTATION_BUNDLE" ./release-candidate.attestation.jsonl

      - name: Upload immutable candidate evidence
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-candidate-${{ github.sha }}
          path: |
            smartergpt-lex-*.tgz
            release-candidate.json
            release-candidate.attestation.jsonl
          retention-days: 30
          if-no-files-found: error

  smoke-windows:
    name: Smoke exact candidate on Windows
    needs: build-candidate
    runs-on: windows-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.1"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Pin npm used by the packed consumer
        run: npm install --global npm@11.11.0

      - name: Install consumer verification dependencies
        run: npm ci --ignore-scripts

      - name: Download exact candidate by immutable ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build-candidate.outputs.artifact-id }}
          path: .

      - name: Verify receipt and run normal-lifecycle packed smoke
        shell: pwsh
        run: |
          node scripts/verify-release-candidate.mjs --check-only
          node scripts/consumer-smoke-test.mjs --candidate release-candidate.json

  publish-npm:
    name: Publish exact candidate to npm
    needs:
      - validate-identity
      - build-candidate
      - smoke-windows
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.1"
          registry-url: "https://registry.npmjs.org"

      - name: Pin trusted-publishing npm
        run: npm install --global npm@11.12.1

      - name: Install verified GitHub attestation CLI
        shell: bash
        run: |
          set -euo pipefail
          GH_ROOT="$RUNNER_TEMP/gh-verify"
          mkdir -p "$GH_ROOT"
          curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERIFY_VERSION}/gh_${GH_VERIFY_VERSION}_linux_amd64.tar.gz" -o "$GH_ROOT/gh.tar.gz"
          (
            cd "$GH_ROOT"
            echo "${GH_VERIFY_SHA256}  gh.tar.gz" | sha256sum -c -
            tar xzf gh.tar.gz
          )
          echo "$GH_ROOT/gh_${GH_VERIFY_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"

      - name: Verify immutable artifact service record
        env:
          ARTIFACT_ID: ${{ needs.build-candidate.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.build-candidate.outputs.artifact-digest }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          readarray -t FACTS < <(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq '[.name, .digest, (.expired | tostring), (.workflow_run.id | tostring)] | .[]')
          if [ "${FACTS[0]}" != "npm-candidate-$GITHUB_SHA" ] || [ "${FACTS[1]}" != "sha256:$ARTIFACT_DIGEST" ] || [ "${FACTS[2]}" != "false" ] || [ "${FACTS[3]}" != "$GITHUB_RUN_ID" ]; then
            echo "Candidate artifact is not bound to this workflow run and commit"
            exit 1
          fi

      - name: Download exact candidate by immutable ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build-candidate.outputs.artifact-id }}
          path: .

      - name: Verify candidate receipt and validated main
        env:
          MAIN_SNAPSHOT: ${{ needs.validate-identity.outputs.main_snapshot }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-release-candidate.mjs --check-only
          RECEIPT_COMMIT=$(node -p "require('./release-candidate.json').source.commit")
          RECEIPT_MAIN=$(node -p "require('./release-candidate.json').source.validatedMain")
          RECEIPT_RELEASE_IDENTITY=$(node -p "String(require('./release-candidate.json').source.releaseIdentity)")
          if [ "$RECEIPT_COMMIT" != "$GITHUB_SHA" ] || [ "$RECEIPT_MAIN" != "$MAIN_SNAPSHOT" ] || [ "$MAIN_SNAPSHOT" != "$GITHUB_SHA" ] || [ "$RECEIPT_RELEASE_IDENTITY" != "null" ]; then
            echo "Candidate receipt or validated main does not match the release commit"
            exit 1
          fi

      - name: Publish through npm trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          OBSERVED_MAIN=$(git rev-parse FETCH_HEAD)
          if [ "$OBSERVED_MAIN" != "$GITHUB_SHA" ]; then
            echo "Current main changed after candidate identity validation"
            exit 1
          fi
          EXPECTED=$(node -p "require('./release-candidate.json').artifact.integrity")
          NAME=$(node -p "require('./release-candidate.json').package.name")
          VERSION=$(node -p "require('./release-candidate.json').package.version")
          TARBALL=$(node -p "require('node:path').resolve(require('./release-candidate.json').artifact.filename)")
          OBSERVED=$(npm view "$NAME@$VERSION" dist.integrity 2>/dev/null || true)
          if [ -z "$OBSERVED" ]; then
            npm publish "$TARBALL" --access public --provenance
          elif [ "$OBSERVED" = "$EXPECTED" ]; then
            echo "$NAME@$VERSION has the exact retained integrity; recovery still requires verified workflow provenance"
          else
            echo "$NAME@$VERSION already exists with different immutable bytes"
            exit 1
          fi

      - name: Verify published integrity
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=$(node -p "require('./release-candidate.json').artifact.integrity")
          NAME=$(node -p "require('./release-candidate.json').package.name")
          VERSION=$(node -p "require('./release-candidate.json').package.version")
          TARBALL=$(node -p "require('node:path').resolve(require('./release-candidate.json').artifact.filename)")
          for attempt in {1..12}; do
            OBSERVED=$(npm view "$NAME@$VERSION" dist.integrity 2>/dev/null || true)
            if [ "$OBSERVED" = "$EXPECTED" ]; then
              node scripts/verify-published-candidate.mjs
              break
            fi
            sleep 5
          done
          if [ "$OBSERVED" != "$EXPECTED" ]; then
            echo "Published integrity did not converge to the retained candidate"
            exit 1
          fi
          AUDIT_DIR=$(mktemp -d)
          cd "$AUDIT_DIR"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --save-exact "$NAME@$VERSION"
          npm audit signatures --json --include-attestations > provenance-audit.json
          node "$GITHUB_WORKSPACE/scripts/verify-npm-provenance.mjs" \
            --audit provenance-audit.json \
            --name "$NAME" \
            --version "$VERSION" \
            --integrity "$EXPECTED" \
            --repository "https://github.com/$GITHUB_REPOSITORY" \
            --workflow .github/workflows/release.yml \
            --ref refs/heads/main \
            --commit "$GITHUB_SHA" \
            --bundle-output provenance.bundle.json
          gh attestation verify "$TARBALL" \
            --bundle provenance.bundle.json \
            --repo "$GITHUB_REPOSITORY" \
            --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA" \
            --signer-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --digest-alg sha512 \
            --predicate-type https://slsa.dev/provenance/v1 \
            --format json > github-verification.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const verified = JSON.parse(readFileSync("github-verification.json", "utf8"));
            if (!Array.isArray(verified) || verified.length !== 1) {
              throw new Error("expected exactly one certificate-bound npm provenance result");
            }
          '

  create-github-release:
    name: Verify public candidate and create GitHub release
    needs:
      - validate-identity
      - build-candidate
      - smoke-windows
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.1"
          registry-url: "https://registry.npmjs.org"

      - name: Pin verification npm
        run: npm install --global npm@11.12.1

      - name: Install verified GitHub attestation CLI
        shell: bash
        run: |
          set -euo pipefail
          GH_ROOT="$RUNNER_TEMP/gh-verify"
          mkdir -p "$GH_ROOT"
          curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERIFY_VERSION}/gh_${GH_VERIFY_VERSION}_linux_amd64.tar.gz" -o "$GH_ROOT/gh.tar.gz"
          (
            cd "$GH_ROOT"
            echo "${GH_VERIFY_SHA256}  gh.tar.gz" | sha256sum -c -
            tar xzf gh.tar.gz
          )
          echo "$GH_ROOT/gh_${GH_VERIFY_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"

      - name: Verify immutable artifact service record
        env:
          ARTIFACT_ID: ${{ needs.build-candidate.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.build-candidate.outputs.artifact-digest }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          readarray -t FACTS < <(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq '[.name, .digest, (.expired | tostring), (.workflow_run.id | tostring)] | .[]')
          if [ "${FACTS[0]}" != "npm-candidate-$GITHUB_SHA" ] || [ "${FACTS[1]}" != "sha256:$ARTIFACT_DIGEST" ] || [ "${FACTS[2]}" != "false" ] || [ "${FACTS[3]}" != "$GITHUB_RUN_ID" ]; then
            echo "Candidate artifact is not bound to this workflow run and commit"
            exit 1
          fi

      - name: Download exact candidate by immutable ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build-candidate.outputs.artifact-id }}
          path: .

      - name: Verify signed candidate receipt and release source
        env:
          COMMIT_SIGNER: ${{ needs.validate-identity.outputs.commit_signer }}
          MAIN_SNAPSHOT: ${{ needs.validate-identity.outputs.main_snapshot }}
          TAG_OBJECT: ${{ needs.validate-identity.outputs.tag_object }}
          TAG_SIGNER: ${{ needs.validate-identity.outputs.tag_signer }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-release-candidate.mjs --check-only
          RECEIPT_COMMIT=$(node -p "require('./release-candidate.json').source.commit")
          RECEIPT_MAIN=$(node -p "require('./release-candidate.json').source.validatedMain")
          RECEIPT_TAG_OBJECT=$(node -p "require('./release-candidate.json').source.releaseIdentity.tagObject")
          RECEIPT_TAG_SIGNER=$(node -p "require('./release-candidate.json').source.releaseIdentity.tagSigner")
          RECEIPT_COMMIT_SIGNER=$(node -p "require('./release-candidate.json').source.releaseIdentity.commitSigner")
          if [ "$RECEIPT_COMMIT" != "$GITHUB_SHA" ] || [ "$RECEIPT_MAIN" != "$MAIN_SNAPSHOT" ] || [ "$MAIN_SNAPSHOT" != "$GITHUB_SHA" ] || [ "$RECEIPT_TAG_OBJECT" != "$TAG_OBJECT" ] || [ "$RECEIPT_TAG_SIGNER" != "$TAG_SIGNER" ] || [ "$RECEIPT_COMMIT_SIGNER" != "$COMMIT_SIGNER" ]; then
            echo "Candidate receipt or signed release identity does not match the release commit"
            exit 1
          fi

      - name: Verify immutable public npm integrity
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=$(node -p "require('./release-candidate.json').artifact.integrity")
          NAME=$(node -p "require('./release-candidate.json').package.name")
          VERSION=$(node -p "require('./release-candidate.json').package.version")
          OBSERVED=$(npm view "$NAME@$VERSION" dist.integrity 2>/dev/null || true)
          if [ "$OBSERVED" != "$EXPECTED" ]; then
            echo "$NAME@$VERSION is absent or does not match the signed-tag candidate"
            exit 1
          fi
          node scripts/verify-published-candidate.mjs

      - name: Verify public npm workflow provenance
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=$(node -p "require('./release-candidate.json').artifact.integrity")
          NAME=$(node -p "require('./release-candidate.json').package.name")
          VERSION=$(node -p "require('./release-candidate.json').package.version")
          TARBALL=$(node -p "require('node:path').resolve(require('./release-candidate.json').artifact.filename)")
          AUDIT_DIR=$(mktemp -d)
          cd "$AUDIT_DIR"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --save-exact "$NAME@$VERSION"
          npm audit signatures --json --include-attestations > provenance-audit.json
          node "$GITHUB_WORKSPACE/scripts/verify-npm-provenance.mjs" \
            --audit provenance-audit.json \
            --name "$NAME" \
            --version "$VERSION" \
            --integrity "$EXPECTED" \
            --repository "https://github.com/$GITHUB_REPOSITORY" \
            --workflow .github/workflows/release.yml \
            --ref refs/heads/main \
            --commit "$GITHUB_SHA" \
            --bundle-output provenance.bundle.json
          gh attestation verify "$TARBALL" \
            --bundle provenance.bundle.json \
            --repo "$GITHUB_REPOSITORY" \
            --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA" \
            --signer-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --digest-alg sha512 \
            --predicate-type https://slsa.dev/provenance/v1 \
            --format json > github-verification.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const verified = JSON.parse(readFileSync("github-verification.json", "utf8"));
            if (!Array.isArray(verified) || verified.length !== 1) {
              throw new Error("expected exactly one certificate-bound npm provenance result");
            }
          '

      - name: Verify the exact public Lex-MCP dependency edge
        shell: bash
        run: |
          set -euo pipefail
          WRAPPER_NAME=$(node -p "require('./server.json').packages[0].identifier")
          WRAPPER_VERSION=$(node -p "require('./server.json').packages[0].version")
          LEX_VERSION=$(node -p "require('./package.json').version")
          npm view "$WRAPPER_NAME@$WRAPPER_VERSION" version engines dependencies dist.integrity --json > lex-mcp-public.json
          node scripts/verify-lex-mcp-public.mjs \
            --metadata lex-mcp-public.json \
            --name "$WRAPPER_NAME" \
            --version "$WRAPPER_VERSION" \
            --lex-version "$LEX_VERSION"

      - name: Re-verify remote release identity before GitHub release
        env:
          TAG_OBJECT: ${{ needs.validate-identity.outputs.tag_object }}
        shell: bash
        run: |
          set -euo pipefail
          readarray -t REMOTE < <(git ls-remote origin "refs/tags/$GITHUB_REF_NAME" "refs/tags/$GITHUB_REF_NAME^{}")
          OBSERVED_OBJECT=$(printf '%s\n' "${REMOTE[@]}" | awk -v ref="refs/tags/$GITHUB_REF_NAME" '$2 == ref { print $1 }')
          OBSERVED_TARGET=$(printf '%s\n' "${REMOTE[@]}" | awk -v ref="refs/tags/$GITHUB_REF_NAME^{}" '$2 == ref { print $1 }')
          git fetch --no-tags origin main
          OBSERVED_MAIN=$(git rev-parse FETCH_HEAD)
          if [ "$OBSERVED_OBJECT" != "$TAG_OBJECT" ] || [ "$OBSERVED_TARGET" != "$GITHUB_SHA" ] || [ "$OBSERVED_MAIN" != "$GITHUB_SHA" ]; then
            echo "Remote release tag or current main changed after public-integrity verification"
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            smartergpt-lex-*.tgz
            release-candidate.json
            release-candidate.attestation.jsonl
          fail_on_unmatched_files: true
